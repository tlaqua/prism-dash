<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PRISM DASH</title>
  <style>
    :root {
      --bg: #080518;
      --panel: rgba(16, 12, 38, 0.88);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f8faff;
      --muted: #a6b0d6;
      --accent: #00f5d4;
      --pink: #ff2a85;
      --gold: #ffd166;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #1b1046 0%, #070414 75%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* HUD */
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 20px;
    }

    .hud-top {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
    }

    .progress-wrap {
      flex: 1;
      height: 16px;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 18px rgba(0, 245, 212, 0.2);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f5d4, #00bbf9, #f15bb5, #fee440);
      border-radius: 999px;
      transition: width 0.06s linear;
    }

    .hud-pill {
      pointer-events: auto;
      background: rgba(12, 10, 32, 0.72);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .hud-pill:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .hud-pill.active {
      border-color: #00f5d4;
      color: #00f5d4;
      box-shadow: 0 0 14px rgba(0, 245, 212, 0.35);
    }

    .hud-stat {
      font-weight: 800;
      font-size: 14px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      min-width: 52px;
      text-align: right;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
    }

    /* Overlay Screens */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: radial-gradient(circle at center, rgba(16, 10, 44, 0.55), rgba(6, 4, 18, 0.85));
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    .card {
      width: 100%;
      max-width: 860px;
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 26px 28px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 245, 212, 0.12);
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4.4vw, 44px);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #00f5d4, #00bbf9, #ff4ecd, #fee440);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 16px rgba(0, 245, 212, 0.28));
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .level-card {
      position: relative;
      border-radius: 16px;
      padding: 16px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    .level-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .level-card.selected {
      border-color: var(--accent);
      background: rgba(0, 245, 212, 0.08);
      box-shadow: 0 0 24px rgba(0, 245, 212, 0.22);
    }

    .level-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .level-name {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .level-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .mini-bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      overflow: hidden;
      margin-bottom: 6px;
    }

    .mini-bar > div {
      height: 100%;
      border-radius: 999px;
    }

    .level-best {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #dbe4ff;
    }

    .bottom-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .customizer {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #skinPreview {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(0,0,0,0.35);
      border: 1.5px solid rgba(255,255,255,0.2);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255,255,255,0.2);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    .btn-play {
      padding: 14px 34px;
      font-size: 18px;
      letter-spacing: 1px;
      color: #050816;
      background: linear-gradient(90deg, #00f5d4, #00bbf9, #fee440);
      border: none;
      box-shadow: 0 8px 28px rgba(0, 245, 212, 0.38);
    }

    .controls-hint {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .kbd {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
    }

    .modal-card {
      max-width: 460px;
      text-align: center;
    }

    .modal-card h2 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 900;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
  </style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- In-Game HUD -->
  <div id="hud">
    <div class="hud-top">
      <button class="hud-pill" id="btnPause" title="Pause (Esc)">II Pause</button>
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="hud-stat" id="progressText">0%</div>
      <button class="hud-pill" id="btnPracticeHud" title="Toggle Practice Mode (P)">◆ Practice</button>
      <button class="hud-pill" id="btnMuteHud" title="Mute / Unmute (M)">🔊</button>
    </div>
    <div class="hud-bottom">
      <div id="hudLevelInfo">Attempt #1</div>
      <div id="hudPracticeHint"></div>
    </div>
  </div>

  <!-- Main Menu Overlay -->
  <div id="menuOverlay" class="overlay">
    <div class="card">
      <div class="title-row">
        <div>
          <h1>PRISM DASH</h1>
          <div class="subtitle">Colorful Rhythm Platformer • Built for Cloudflare Workers</div>
        </div>
        <div class="top-actions">
          <button class="btn" id="btnMenuPractice">◆ Practice: OFF</button>
          <button class="btn" id="btnMenuMute">🔊 Sound: ON</button>
        </div>
      </div>

      <div class="levels-grid" id="levelsGrid"></div>

      <div class="bottom-bar">
        <div class="customizer">
          <canvas id="skinPreview" width="96" height="96"></canvas>
          <div>
            <div style="font-weight:800;font-size:14px;margin-bottom:6px;">Cube Style</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn" id="btnCycleColor" style="padding:7px 12px;font-size:12px;">🎨 Color</button>
              <button class="btn" id="btnCycleFace" style="padding:7px 12px;font-size:12px;">😎 Face</button>
            </div>
          </div>
        </div>

        <button class="btn btn-play" id="btnPlay">▶ PLAY</button>
      </div>

      <div class="controls-hint">
        <span class="kbd">SPACE</span> <span class="kbd">W</span> <span class="kbd">↑</span> or <span class="kbd">CLICK / TAP</span> to Jump &amp; Fly •
        Hold to chain jumps • <span class="kbd">P</span> Practice Mode • <span class="kbd">Z</span> Drop Checkpoint • <span class="kbd">ESC</span> Pause
      </div>
    </div>
  </div>

  <!-- Pause / Victory Overlay -->
  <div id="modalOverlay" class="overlay hidden">
    <div class="card modal-card">
      <h2 id="modalTitle">PAUSED</h2>
      <p id="modalBody" style="color:var(--muted);margin:0 0 8px;"></p>
      <div id="modalStats" style="font-weight:700;font-size:15px;color:#00f5d4;"></div>
      <div class="modal-actions">
        <button class="btn btn-play" id="btnModalPrimary" style="padding:12px 26px;font-size:16px;">Resume</button>
        <button class="btn" id="btnModalRestart">↻ Restart</button>
        <button class="btn" id="btnModalMenu">☰ Menu</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // =========================================================================
  // CONSTANTS & PHYSICS (Fixed 120Hz sub-step for deterministic jumps)
  // =========================================================================
  const VW = 1280;
  const VH = 720;
  const GROUND_Y = 580;
  const CEILING_Y = 76;
  const TILE = 50;
  const PLAYER_SIZE = 48;
  const FIXED_DT = 1 / 120;

  const BASE_SPEED = 420;
  const GRAVITY = 3500;
  const JUMP_VY = -910;
  const PAD_VY = -1280;
  const ORB_VY = -890;

  const SHIP_GRAVITY = 1780;
  const SHIP_THRUST = -2250;
  const SHIP_MAX_VY = 470;

  const SKINS = [
    { name: "Cyber Mint", primary: "#00f5d4", secondary: "#00bbf9", glow: "#00f5d4" },
    { name: "Plasma Pink", primary: "#ff2a85", secondary: "#fee440", glow: "#ff2a85" },
    { name: "Solar Flare", primary: "#ff9f1c", secondary: "#ff3366", glow: "#ff9f1c" },
    { name: "Ultraviolet", primary: "#9b5de5", secondary: "#00f5d4", glow: "#c77dff" },
    { name: "Acid Lime", primary: "#80ed99", secondary: "#38b000", glow: "#80ed99" },
    { name: "Ruby Volt", primary: "#ff4d6d", secondary: "#ffffff", glow: "#ff4d6d" }
  ];

  const FACES = ["classic", "visor", "cyclops", "star"];

  // =========================================================================
  // STORAGE
  // =========================================================================
  const STORAGE_KEY = "prism_dash_save_v1";
  const save = (() => {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      return {
        skinIdx: Number.isInteger(parsed.skinIdx) ? parsed.skinIdx % SKINS.length : 0,
        faceIdx: Number.isInteger(parsed.faceIdx) ? parsed.faceIdx % FACES.length : 0,
        muted: !!parsed.muted,
        best: parsed.best || {},
        practiceBest: parsed.practiceBest || {}
      };
    } catch {
      return { skinIdx: 0, faceIdx: 0, muted: false, best: {}, practiceBest: {} };
    }
  })();

  function persistSave() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
    } catch {}
  }

  // =========================================================================
  // PROCEDURAL WEB AUDIO SYNTHESIZER (Beat-synced to level time)
  // =========================================================================
  const AudioEngine = (() => {
    let ctx = null;
    let master = null;
    let noiseBuffer = null;

    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = save.muted ? 0 : 0.38;
        master.connect(ctx.destination);

        // White noise buffer for snares/hats/crashes
        const len = ctx.sampleRate * 0.4;
        noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      return ctx;
    }

    function setMuted(m) {
      save.muted = m;
      persistSave();
      if (master && ctx) {
        master.gain.setTargetAtTime(m ? 0 : 0.38, ctx.currentTime, 0.02);
      }
    }

    function kick(time) {
      if (!ctx || save.muted) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(145, time);
      osc.frequency.exponentialRampToValueAtTime(38, time + 0.13);
      gain.gain.setValueAtTime(0.85, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.16);
      osc.connect(gain).connect(master);
      osc.start(time);
      osc.stop(time + 0.17);
    }

    function snare(time) {
      if (!ctx || save.muted || !noiseBuffer) return;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 1100;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.28, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
      src.connect(filter).connect(gain).connect(master);
      src.start(time);
      src.stop(time + 0.13);
    }

    function hat(time) {
      if (!ctx || save.muted || !noiseBuffer) return;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 6500;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.09, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
      src.connect(filter).connect(gain).connect(master);
      src.start(time);
      src.stop(time + 0.05);
    }

    function synthNote(time, freq, dur, type, vol, cutoff = 2400) {
      if (!ctx || save.muted || freq <= 0) return;
      const osc = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, time);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(cutoff, time);
      filter.frequency.exponentialRampToValueAtTime(Math.max(260, cutoff * 0.35), time + dur);
      gain.gain.setValueAtTime(0.001, time);
      gain.gain.linearRampToValueAtTime(vol, time + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
      osc.connect(filter).connect(gain).connect(master);
      osc.start(time);
      osc.stop(time + dur + 0.02);
    }

    function playSFX(kind) {
      const c = ensure();
      if (!c || save.muted) return;
      const t = c.currentTime;
      if (kind === "pad") {
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(360, t);
        osc.frequency.exponentialRampToValueAtTime(980, t + 0.14);
        g.gain.setValueAtTime(0.24, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        osc.connect(g).connect(master);
        osc.start(t);
        osc.stop(t + 0.17);
      } else if (kind === "orb") {
        synthNote(t, 740, 0.09, "sine", 0.22, 4000);
        synthNote(t + 0.04, 1108, 0.12, "triangle", 0.18, 4000);
      } else if (kind === "portal") {
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.22);
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
        osc.connect(g).connect(master);
        osc.start(t);
        osc.stop(t + 0.25);
      } else if (kind === "crash") {
        if (noiseBuffer) {
          const src = c.createBufferSource();
          src.buffer = noiseBuffer;
          const f = c.createBiquadFilter();
          f.type = "lowpass";
          f.frequency.setValueAtTime(1400, t);
          f.frequency.exponentialRampToValueAtTime(160, t + 0.28);
          const g = c.createGain();
          g.gain.setValueAtTime(0.45, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          src.connect(f).connect(g).connect(master);
          src.start(t);
          src.stop(t + 0.32);
        }
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.24);
        g.gain.setValueAtTime(0.35, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(g).connect(master);
        osc.start(t);
        osc.stop(t + 0.26);
      } else if (kind === "win") {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          synthNote(t + idx * 0.08, f, 0.35, "triangle", 0.24, 4800);
        });
      }
    }

    function midiToFreq(m) {
      return 440 * Math.pow(2, (m - 69) / 12);
    }

    function scheduleStep(stepIndex, when, song) {
      ensure();
      if (!ctx || save.muted) return;
      const barStep = stepIndex % 16;
      const chordBar = Math.floor(stepIndex / 16) % song.chords.length;
      const root = song.chords[chordBar];

      // Drums
      if (barStep % 4 === 0) kick(when);
      if (barStep === 4 || barStep === 12) snare(when);
      if (barStep % 2 === 1) hat(when);

      // Driving off-beat / 8th bass
      if (barStep % 2 === 0) {
        const oct = barStep % 4 === 2 ? 12 : 0;
        synthNote(when, midiToFreq(root - 24 + oct), 0.14, "sawtooth", 0.22, 950);
      }

      // Colorful lead arp
      const arpPattern = song.arp[barStep];
      if (arpPattern !== null) {
        const semi = song.scale[arpPattern % song.scale.length];
        synthNote(when, midiToFreq(root + semi), 0.16, song.leadWave, 0.14, 3400);
      }
    }

    return { ensure, setMuted, playSFX, scheduleStep, getCurrentTime: () => (ctx ? ctx.currentTime : 0) };
  })();

  // =========================================================================
  // LEVEL BUILDER HELPERS
  // =========================================================================
  // row = 0 sits directly on GROUND_Y. y = GROUND_Y - (row + 1) * TILE
  function rowToY(row) {
    return GROUND_Y - (row + 1) * TILE;
  }

  function makeLevelBuilder() {
    const objects = [];
    const block = (col, row, w = 1, h = 1) => {
      for (let dx = 0; dx < w; dx++) {
        for (let dy = 0; dy < h; dy++) {
          objects.push({ type: "block", x: (col + dx) * TILE, y: rowToY(row + dy), w: TILE, h: TILE });
        }
      }
    };
    const spike = (col, row = 0, dir = "up") => {
      objects.push({ type: "spike", x: col * TILE, y: rowToY(row), w: TILE, h: TILE, dir });
    };
    const spikes = (col, count, row = 0, dir = "up") => {
      for (let i = 0; i < count; i++) spike(col + i, row, dir);
    };
    const pad = (col, row = 0) => {
      objects.push({ type: "pad", x: col * TILE, y: rowToY(row) + TILE - 14, w: TILE, h: 14 });
    };
    const orb = (col, row) => {
      objects.push({
        type: "orb",
        x: col * TILE + TILE / 2,
        y: rowToY(row) + TILE / 2,
        r: 19,
        used: false
      });
    };
    const portal = (col, mode) => {
      objects.push({
        type: "portal",
        x: col * TILE,
        y: GROUND_Y - 175,
        w: 44,
        h: 175,
        mode,
        triggered: false
      });
    };

    return { objects, block, spike, spikes, pad, orb, portal };
  }

  function resizeCanvas() {

  // =========================================================================

  function renderLevelCards() {
    const grid = document.getElementById("levelsGrid");
    grid.innerHTML = "";
    LEVELS.forEach((lvl, idx) => {
      const best = save.best[lvl.id] || 0;
      const pBest = save.practiceBest[lvl.id] || 0;
      const card = document.createElement("div");
      card.className = "level-card" + (idx === selectedLevelIdx ? " selected" : "");
      card.innerHTML = `
        <span class="level-badge" style="background:${lvl.badgeColor}22;color:${lvl.badgeColor};border:1px solid ${lvl.badgeColor}66;">
          ${lvl.difficulty} • ${lvl.bpm} BPM
        </span>
        <div class="level-name">${lvl.name}</div>
        <div class="level-meta">${lvl.speedMult}x Speed • ${Math.round((lvl.lengthCols * TILE) / (BASE_SPEED * lvl.speedMult))}s</div>
        <div class="mini-bar">
          <div style="width:${best}%;background:linear-gradient(90deg, ${lvl.badgeColor}, #fee440);"></div>
        </div>
        <div class="level-best">
          <span>Best: ${best >= 100 ? "★ 100%" : best + "%"}</span>
          <span style="color:#a6b0d6;">Practice: ${pBest}%</span>
        </div>
      `;
      card.addEventListener("click", () => {
        selectedLevelIdx = idx;
        renderLevelCards();
      });
      grid.appendChild(card);
    });
  }

  // =========================================================================
  // GAME FLOW
  // =========================================================================
  function startLevel(idx) {
    selectedLevelIdx = idx;
    level = LEVELS[idx];
    levelEndX = level.lengthCols * TILE;
    attempts = 1;
    checkpoints = [];
    menuOverlay.classList.add("hidden");
    modalOverlay.classList.add("hidden");
    hud.style.display = "flex";
    resetRun(true);
    updatePracticeButtons();
    gameState = "playing";
  }

  function resetRun(fullReset = false) {
    if (fullReset) checkpoints = [];
    const cp = practiceMode && checkpoints.length > 0 ? checkpoints[checkpoints.length - 1] : null;

    level.objects.forEach((o) => {
      if (o.type === "orb") o.used = false;
      if (o.type === "portal") o.triggered = cp ? o.x < cp.x : false;
    });

    if (cp) {
      player.x = cp.x;
      player.y = cp.y;
      player.vy = 0;
      player.rot = 0;
      player.mode = cp.mode;
      player.onGround = cp.onGround;
      levelTime = cp.time;
    } else {
      player.x = 0;
      player.y = GROUND_Y - PLAYER_SIZE;
      player.vy = 0;
      player.rot = 0;
      player.mode = "cube";
      player.onGround = true;
      levelTime = 0;
    }

    player.trail = [];
    particles = [];
    cameraX = player.x - 280;
    autoCpTimer = 0;
    jumpBufferTimer = 0;
    lastAudioStep = Math.floor(levelTime / (60 / level.bpm / 4));
    hudLevelInfo.textContent = `${level.name} • Attempt #${attempts}`;
  }

  function dropCheckpoint() {
    if (!practiceMode || gameState !== "playing") return;
    checkpoints.push({
      x: player.x,
      y: player.y,
      mode: player.mode,
      onGround: player.onGround,
      time: levelTime
    });
    spawnBurst(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, "#00f5d4", 12, 160);
  }

  function togglePracticeInGame() {
    practiceMode = !practiceMode;
    if (!practiceMode) checkpoints = [];
    else dropCheckpoint();
    updatePracticeButtons();
  }

  function pauseGame() {
    gameState = "paused";
    inputHeld = false;
    document.getElementById("modalTitle").textContent = "PAUSED";
    document.getElementById("modalBody").textContent = `${level.name} (${level.difficulty})`;
    const pct = Math.min(100, Math.floor((player.x / levelEndX) * 100));
    document.getElementById("modalStats").textContent = `Progress: ${pct}% • Attempt #${attempts}`;
    document.getElementById("btnModalPrimary").textContent = "▶ Resume";
    modalOverlay.classList.remove("hidden");
  }

  function resumeGame() {
    modalOverlay.classList.add("hidden");
    gameState = "playing";
  }

  function showMenu() {
    gameState = "menu";
    inputHeld = false;
    hud.style.display = "none";
    modalOverlay.classList.add("hidden");
    menuOverlay.classList.remove("hidden");
    renderLevelCards();
  }

  function triggerCrash() {
    if (gameState !== "playing") return;
    gameState = "dead";
    deathTimer = practiceMode ? 0.45 : 0.62;
    shakeTimer = 0.25;
    AudioEngine.playSFX("crash");
    const skin = SKINS[save.skinIdx];
    spawnBurst(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, skin.primary, 26, 420);
    spawnBurst(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, skin.secondary, 16, 320);

    const pct = Math.min(99, Math.floor((player.x / levelEndX) * 100));
    if (practiceMode) {
      save.practiceBest[level.id] = Math.max(save.practiceBest[level.id] || 0, pct);
    } else {
      save.best[level.id] = Math.max(save.best[level.id] || 0, pct);
    }
    persistSave();
  }

  function triggerVictory() {
    if (gameState !== "playing") return;
    gameState = "won";
    inputHeld = false;
    AudioEngine.playSFX("win");
    spawnBurst(player.x + 24, player.y + 24, "#00f5d4", 32, 460);
    spawnBurst(player.x + 24, player.y + 24, "#fee440", 32, 460);

    if (practiceMode) {
      save.practiceBest[level.id] = 100;
    } else {
      save.best[level.id] = 100;
    }
    persistSave();

    progressFill.style.width = "100%";
    progressText.textContent = "100%";
    document.getElementById("modalTitle").textContent = "LEVEL COMPLETE!";
    document.getElementById("modalBody").textContent = practiceMode
      ? `Cleared ${level.name} in Practice Mode! Try Normal Mode for the crown!`
      : `You conquered ${level.name}!`;
    document.getElementById("modalStats").textContent = `Attempts: ${attempts} • Time: ${levelTime.toFixed(1)}s`;
    document.getElementById("btnModalPrimary").textContent = "↻ Play Again";
    setTimeout(() => {
      if (gameState === "won") modalOverlay.classList.remove("hidden");
    }, 550);
  }

  // =========================================================================
  // INPUT HANDLING
  // =========================================================================
  function pressJump() {
    AudioEngine.ensure();
    if (gameState === "playing") {
      inputHeld = true;
      jumpBufferTimer = 0.11;
    }
  }

  function releaseJump() {
    inputHeld = false;
  }

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      if (gameState === "playing") e.preventDefault();
      if (!e.repeat) pressJump();
    } else if (e.code === "Escape") {
      if (gameState === "playing") pauseGame();
      else if (gameState === "paused") resumeGame();
    } else if (e.code === "KeyP") {
      if (gameState === "playing") togglePracticeInGame();
      else if (gameState === "menu") {
        practiceMode = !practiceMode;
        updatePracticeButtons();
      }
    } else if (e.code === "KeyZ") {
      dropCheckpoint();
    } else if (e.code === "KeyM") {
      AudioEngine.ensure();
      AudioEngine.setMuted(!save.muted);
      updateMuteButtons();
    } else if (e.code === "KeyR" && (gameState === "playing" || gameState === "paused")) {
      startLevel(selectedLevelIdx);
    }
  });

  window.addEventListener("keyup", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      releaseJump();
    }
  });

  canvas.addEventListener("pointerdown", (e) => {
    if (gameState === "playing") {
      e.preventDefault();
      pressJump();
    }
  });
  window.addEventListener("pointerup", releaseJump);
  window.addEventListener("pointercancel", releaseJump);

  // =========================================================================
  // PARTICLES
  // =========================================================================
  function spawnBurst(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (0.3 + Math.random() * 0.7) * speed;
      particles.push({
        x,
        y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 60,
        size: 4 + Math.random() * 7,
        color,
        life: 0.35 + Math.random() * 0.35,
        maxLife: 0.7
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 900 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // =========================================================================
  // PHYSICS STEP
  // =========================================================================
  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function stepPhysics(dt) {
    levelTime += dt;
    const speed = BASE_SPEED * level.speedMult;

    // Beat-synced Web Audio scheduler (lookahead 100ms)
    const stepDur = 60 / level.bpm / 4; // 16th note
    const targetStep = Math.floor((levelTime + 0.08) / stepDur);
    while (lastAudioStep < targetStep) {
      lastAudioStep++;
      const stepTime = lastAudioStep * stepDur;
      const delta = Math.max(0, stepTime - levelTime);
      AudioEngine.scheduleStep(lastAudioStep, AudioEngine.getCurrentTime() + delta, level.song);
      if (lastAudioStep % 4 === 0) beatPulse = 1;
    }

    if (jumpBufferTimer > 0) jumpBufferTimer -= dt;

    const prevX = player.x;
    const prevY = player.y;
    const prevRight = prevX + PLAYER_SIZE;
    const prevBottom = prevY + PLAYER_SIZE;

    // Horizontal movement
    player.x += speed * dt;

    // Vertical movement
    if (player.mode === "cube") {
      if (player.onGround && (inputHeld || jumpBufferTimer > 0)) {
        player.vy = JUMP_VY;
        player.onGround = false;
        jumpBufferTimer = 0;
        spawnBurst(player.x + 12, player.y + PLAYER_SIZE, "#ffffff", 5, 130);
      }
      player.vy += GRAVITY * dt;
      player.y += player.vy * dt;

      if (!player.onGround) {
        player.rot += 6.6 * dt;
      } else {
        // Snap smoothly to nearest 90 degrees
        const snap = Math.round(player.rot / (Math.PI / 2)) * (Math.PI / 2);
        player.rot += (snap - player.rot) * Math.min(1, 24 * dt);
      }
    } else {
      // Ship mode
      player.vy += (inputHeld ? SHIP_THRUST : SHIP_GRAVITY) * dt;
      player.vy = Math.max(-SHIP_MAX_VY, Math.min(SHIP_MAX_VY, player.vy));
      player.y += player.vy * dt;
      player.rot = Math.max(-0.55, Math.min(0.55, player.vy / 720));
    }

    player.onGround = false;

    // Floor & Ceiling constraints
    if (player.y + PLAYER_SIZE >= GROUND_Y) {
      player.y = GROUND_Y - PLAYER_SIZE;
      player.vy = 0;
      player.onGround = true;
    }
    if (player.mode === "ship" && player.y <= CEILING_Y) {
      player.y = CEILING_Y;
      if (player.vy < 0) player.vy = 0;
    }

    // Object collisions (query nearby range)
    const minX = player.x - 90;
    const maxX = player.x + PLAYER_SIZE + 90;
    const hbPad = 7; // Forgiving inner cube hitbox

    for (let i = 0; i < level.objects.length; i++) {
      const o = level.objects[i];
      if (o.x + (o.w || 40) < minX || o.x - (o.r || 0) > maxX) continue;

      if (o.type === "block") {
        if (rectsOverlap(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE, o.x, o.y, o.w, o.h)) {
          // Land on top
          if (prevBottom <= o.y + 13 && player.vy >= -40) {
            player.y = o.y - PLAYER_SIZE;
            player.vy = 0;
            player.onGround = true;
          } else if (player.mode === "ship" && prevY >= o.y + o.h - 13 && player.vy <= 40) {
            // Ship ceiling bump on block underside
            player.y = o.y + o.h;
            player.vy = 0;
          } else if (prevRight <= o.x + 18 || player.y + PLAYER_SIZE - 10 > o.y) {
            triggerCrash();
            return;
          }
        }
      } else if (o.type === "spike") {
        // Forgiving triangle hitbox
        const sx = o.x + 17;
        const sw = 16;
        const sh = 28;
        const sy = o.dir === "down" ? o.y + 4 : o.y + TILE - sh - 2;
        if (rectsOverlap(player.x + hbPad, player.y + hbPad, PLAYER_SIZE - hbPad * 2, PLAYER_SIZE - hbPad * 2, sx, sy, sw, sh)) {
          triggerCrash();
          return;
        }
      } else if (o.type === "pad") {
        if (rectsOverlap(player.x + 4, player.y, PLAYER_SIZE - 8, PLAYER_SIZE, o.x, o.y, o.w, o.h)) {
          player.vy = PAD_VY;
          player.onGround = false;
          AudioEngine.playSFX("pad");
          spawnBurst(o.x + 25, o.y, "#fee440", 12, 240);
        }
      } else if (o.type === "orb" && !o.used) {
        const cx = player.x + PLAYER_SIZE / 2;
        const cy = player.y + PLAYER_SIZE / 2;
        const dx = cx - o.x;
        const dy = cy - o.y;
        if (dx * dx + dy * dy <= 42 * 42 && jumpBufferTimer > 0) {
          o.used = true;
          jumpBufferTimer = 0;
          player.vy = ORB_VY;
          player.onGround = false;
          AudioEngine.playSFX("orb");
          spawnBurst(o.x, o.y, "#00f5d4", 14, 240);
        }
      } else if (o.type === "portal" && !o.triggered) {
        if (rectsOverlap(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE, o.x, o.y, o.w, o.h)) {
          o.triggered = true;
          player.mode = o.mode;
          if (o.mode === "ship") player.vy = Math.min(player.vy, 0);
          AudioEngine.playSFX("portal");
          spawnBurst(o.x + 22, player.y + 24, o.mode === "ship" ? "#ff2a85" : "#00f5d4", 20, 300);
        }
      }
    }

    // Trail & Practice auto-checkpoint
    player.trail.push({ x: player.x + 10, y: player.y + PLAYER_SIZE / 2, mode: player.mode });
    if (player.trail.length > 18) player.trail.shift();

    if (practiceMode) {
      autoCpTimer += dt;
      if (autoCpTimer >= 3.2 && (player.onGround || player.mode === "ship")) {
        autoCpTimer = 0;
        dropCheckpoint();
      }
    }

    cameraX = player.x - 280;

    if (player.x >= levelEndX) {
      triggerVictory();
    }
  }

  // =========================================================================
  // RENDERING
  // =========================================================================
  function lerpColor(hexA, hexB, t) {
    const a = parseInt(hexA.slice(1), 16);
    const b = parseInt(hexB.slice(1), 16);
    const r = Math.round(((a >> 16) & 255) * (1 - t) + ((b >> 16) & 255) * t);
    const g = Math.round(((a >> 8) & 255) * (1 - t) + ((b >> 8) & 255) * t);
    const bl = Math.round((a & 255) * (1 - t) + (b & 255) * t);
    return `rgb(${r},${g},${bl})`;
  }

  function getActivePalette() {
    const pals = level.palettes;
    const progress = Math.max(0, Math.min(1, player.x / levelEndX));
    const scaled = progress * pals.length;
    const idx = Math.floor(scaled) % pals.length;
    const next = (idx + 1) % pals.length;
    const t = scaled - Math.floor(scaled);
    return {
      bgTop: lerpColor(pals[idx].bgTop, pals[next].bgTop, t),
      bgBot: lerpColor(pals[idx].bgBot, pals[next].bgBot, t),
      grid: lerpColor(pals[idx].grid, pals[next].grid, t),
      accent: lerpColor(pals[idx].accent, pals[next].accent, t),
      floor: lerpColor(pals[idx].floor, pals[next].floor, t)
    };
  }

  function drawCubeSprite(c, cx, cy, size, rot, skin, face) {
    c.save();
    c.translate(cx, cy);
    c.rotate(rot);

    const half = size / 2;
    const grad = c.createLinearGradient(-half, -half, half, half);
    grad.addColorStop(0, skin.primary);
    grad.addColorStop(1, skin.secondary);

    c.shadowColor = skin.glow;
    c.shadowBlur = 16;
    c.fillStyle = grad;
    c.strokeStyle = "#ffffff";
    c.lineWidth = 3;

    c.beginPath();
    c.roundRect(-half, -half, size, size, 7);
    c.fill();
    c.shadowBlur = 0;
    c.stroke();

    // Inner frame
    c.strokeStyle = "rgba(8, 8, 24, 0.45)";
    c.lineWidth = 2;
    c.strokeRect(-half + 6, -half + 6, size - 12, size - 12);

    // Face details
    c.fillStyle = "#0a0820";
    if (face === "classic") {
      c.fillRect(-10, -8, 7, 7);
      c.fillRect(4, -8, 7, 7);
      c.fillRect(-10, 5, 21, 5);
    } else if (face === "visor") {
      c.fillRect(-14, -9, 28, 10);
      c.fillStyle = "#ffffff";
      c.fillRect(-11, -7, 10, 3);
    } else if (face === "cyclops") {
      c.beginPath();
      c.arc(0, -3, 9, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = "#ffffff";
      c.beginPath();
      c.arc(2, -5, 3.5, 0, Math.PI * 2);
      c.fill();
    } else if (face === "star") {
      c.fillStyle = "#ffffff";
      c.beginPath();
      for (let i = 0; i < 5; i++) {
        const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
        const a2 = a1 + Math.PI / 5;
        c.lineTo(Math.cos(a1) * 11, Math.sin(a1) * 11);
        c.lineTo(Math.cos(a2) * 5, Math.sin(a2) * 5);
      }
      c.closePath();
      c.fill();
    }
    c.restore();
  }

  function drawShipSprite(c, cx, cy, rot, skin, face) {
    c.save();
    c.translate(cx, cy);
    c.rotate(rot);

    // Ship hull
    c.shadowColor = skin.glow;
    c.shadowBlur = 16;
    c.fillStyle = skin.secondary;
    c.strokeStyle = "#ffffff";
    c.lineWidth = 2.5;
    c.beginPath();
    c.moveTo(-24, 8);
    c.lineTo(-14, 18);
    c.lineTo(18, 18);
    c.lineTo(28, 6);
    c.lineTo(16, -2);
    c.lineTo(-22, 0);
    c.closePath();
    c.fill();
    c.shadowBlur = 0;
    c.stroke();

    // Mini cube pilot
    drawCubeSprite(c, -2, -10, 26, 0, skin, face);
    c.restore();
  }

  function drawScene() {
    const pal = getActivePalette();

    ctx.save();
    if (shakeTimer > 0) {
      const mag = shakeTimer * 36;
      ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    }

    // Background sky gradient + beat pulse brightening
    const sky = ctx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, pal.bgTop);
    sky.addColorStop(1, pal.bgBot);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, VH);

    if (beatPulse > 0.01) {
      ctx.fillStyle = pal.accent;
      ctx.globalAlpha = beatPulse * 0.08;
      ctx.fillRect(0, 0, VW, VH);
      ctx.globalAlpha = 1;
    }

    // Parallax geometric shapes
    for (let i = 0; i < bgShapes.length; i++) {
      const s = bgShapes[i];
      const sx = ((s.x - cameraX * s.speed) % (VW + 300) + (VW + 300)) % (VW + 300) - 150;
      ctx.save();
      ctx.translate(sx, s.y);
      ctx.rotate(s.rot + levelTime * 0.25);
      const pulseScale = 1 + beatPulse * 0.08;
      ctx.scale(pulseScale, pulseScale);
      ctx.strokeStyle = pal.grid;
      ctx.globalAlpha = 0.14;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let k = 0; k < s.sides; k++) {
        const a = (k / s.sides) * Math.PI * 2;
        const px = Math.cos(a) * s.size;
        const py = Math.sin(a) * s.size;
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    // Ship mode ceiling
    if (player.mode === "ship") {
      ctx.fillStyle = pal.floor;
      ctx.fillRect(0, 0, VW, CEILING_Y);
      ctx.strokeStyle = pal.accent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, CEILING_Y);
      ctx.lineTo(VW, CEILING_Y);
      ctx.stroke();
    }

    // World space rendering
    ctx.save();
    ctx.translate(-cameraX, 0);

    // Practice Checkpoints
    if (practiceMode) {
      for (let i = 0; i < checkpoints.length; i++) {
        const cp = checkpoints[i];
        if (cp.x < cameraX - 80 || cp.x > cameraX + VW + 80) continue;
        ctx.save();
        ctx.translate(cp.x + 24, cp.y + 24);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = "#00f5d4";
        ctx.shadowColor = "#00f5d4";
        ctx.shadowBlur = 12;
        ctx.fillRect(-10, -10, 20, 20);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.strokeRect(-10, -10, 20, 20);
        ctx.restore();
      }
    }

    // Finish Goal Gate
    if (levelEndX > cameraX - 100 && levelEndX < cameraX + VW + 150) {
      const g = ctx.createLinearGradient(levelEndX, 0, levelEndX + 40, 0);
      g.addColorStop(0, "rgba(0, 245, 212, 0.85)");
      g.addColorStop(1, "rgba(254, 228, 64, 0)");
      ctx.fillStyle = g;
      ctx.fillRect(levelEndX, 0, 56, GROUND_Y);
      ctx.strokeStyle = "#fee440";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(levelEndX, 0);
      ctx.lineTo(levelEndX, GROUND_Y);
      ctx.stroke();
    }

    // Visible Obstacles
    const visLeft = cameraX - 100;
    const visRight = cameraX + VW + 100;

    for (let i = 0; i < level.objects.length; i++) {
      const o = level.objects[i];
      if (o.x + (o.w || 40) < visLeft || o.x - (o.r || 0) > visRight) continue;

      if (o.type === "block") {
        ctx.fillStyle = "rgba(10, 12, 34, 0.85)";
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = pal.grid;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
        ctx.fillStyle = pal.accent;
        ctx.globalAlpha = 0.16;
        ctx.fillRect(o.x + 8, o.y + 8, o.w - 16, o.h - 16);
        ctx.globalAlpha = 1;
      } else if (o.type === "spike") {
        ctx.save();
        ctx.fillStyle = "#100c28";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.5;
        ctx.shadowColor = pal.accent;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        if (o.dir === "down") {
          ctx.moveTo(o.x + 3, o.y);
          ctx.lineTo(o.x + o.w / 2, o.y + o.h - 3);
          ctx.lineTo(o.x + o.w - 3, o.y);
        } else {
          ctx.moveTo(o.x + 3, o.y + o.h);
          ctx.lineTo(o.x + o.w / 2, o.y + 3);
          ctx.lineTo(o.x + o.w - 3, o.y + o.h);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.stroke();
        ctx.restore();
      } else if (o.type === "pad") {
        ctx.save();
        ctx.fillStyle = "#fee440";
        ctx.shadowColor = "#fee440";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.roundRect(o.x + 4, o.y, o.w - 8, o.h, [8, 8, 2, 2]);
        ctx.fill();
        ctx.restore();
      } else if (o.type === "orb") {
        ctx.save();
        const pulse = 1 + Math.sin(levelTime * 10) * 0.12;
        ctx.strokeStyle = o.used ? "rgba(255,255,255,0.25)" : "#fee440";
        ctx.fillStyle = o.used ? "rgba(255,255,255,0.1)" : "rgba(0, 245, 212, 0.35)";
        ctx.lineWidth = 3.5;
        ctx.shadowColor = "#fee440";
        ctx.shadowBlur = o.used ? 0 : 16;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else if (o.type === "portal") {
        ctx.save();
        const col = o.mode === "ship" ? "#ff2a85" : "#00f5d4";
        ctx.strokeStyle = col;
        ctx.lineWidth = 4;
        ctx.shadowColor = col;
        ctx.shadowBlur = 22;
        ctx.fillStyle = col + "33";
        ctx.beginPath();
        ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2, 18, o.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    // Player trail
    const skin = SKINS[save.skinIdx];
    for (let i = 0; i < player.trail.length; i++) {
      const tr = player.trail[i];
      const alpha = ((i + 1) / player.trail.length) * 0.45;
      ctx.fillStyle = skin.primary;
      ctx.globalAlpha = alpha;
      const sz = 6 + (i / player.trail.length) * 14;
      ctx.fillRect(tr.x - sz / 2, tr.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;

    // Player sprite
    if (gameState !== "dead") {
      const cx = player.x + PLAYER_SIZE / 2;
      const cy = player.y + PLAYER_SIZE / 2;
      if (player.mode === "cube") {
        drawCubeSprite(ctx, cx, cy, PLAYER_SIZE, player.rot, skin, FACES[save.faceIdx]);
      } else {
        drawShipSprite(ctx, cx, cy, player.rot, skin, FACES[save.faceIdx]);
      }
    }

    // Particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    ctx.restore(); // end world space

    // Scrolling neon ground floor
    ctx.fillStyle = pal.floor;
    ctx.fillRect(0, GROUND_Y, VW, VH - GROUND_Y);

    ctx.strokeStyle = pal.grid;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.35;
    const gridOffset = ((cameraX % TILE) + TILE) % TILE;
    for (let gx = -gridOffset; gx < VW; gx += TILE) {
      ctx.beginPath();
      ctx.moveTo(gx, GROUND_Y);
      ctx.lineTo(gx, VH);
      ctx.stroke();
    }
    for (let gy = GROUND_Y + TILE; gy < VH; gy += TILE) {
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(VW, gy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Glowing horizon line
    ctx.shadowColor = pal.accent;
    ctx.shadowBlur = 14;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(VW, GROUND_Y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  // =========================================================================
  // MAIN LOOP
  // =========================================================================
  let lastFrameTime = performance.now();
  let accumulator = 0;

  function tick(now) {
    const rawDt = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
    lastFrameTime = now;

    beatPulse *= Math.pow(0.04, rawDt);
    if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - rawDt);

    if (gameState === "playing") {
      accumulator += rawDt;
      while (accumulator >= FIXED_DT && gameState === "playing") {
        stepPhysics(FIXED_DT);
        accumulator -= FIXED_DT;
      }
      updateParticles(rawDt);

      const pct = Math.min(100, Math.max(0, Math.floor((player.x / levelEndX) * 100)));
      progressFill.style.width = pct + "%";
      progressText.textContent = pct + "%";
    } else if (gameState === "dead") {
      accumulator = 0;
      updateParticles(rawDt);
      deathTimer -= rawDt;
      if (deathTimer <= 0) {
        attempts++;
        resetRun(false);
        gameState = "playing";
      }
    } else if (gameState === "won") {
      accumulator = 0;
      updateParticles(rawDt);
    } else if (gameState === "menu") {
      levelTime += rawDt;
      cameraX += 110 * rawDt;
    }

    drawScene();
    requestAnimationFrame(tick);
  }

  // Init
  renderLevelCards();
  renderSkinPreview();
  updateMuteButtons();
  updatePracticeButtons();
  requestAnimationFrame(tick);
})();
</script>
